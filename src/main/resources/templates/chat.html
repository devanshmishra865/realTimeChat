<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Real-Time Chat Application</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <!-- SockJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    <!-- STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>


    <!-- Custom CSS -->
    <style>

        /* Whole page */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }


        /* Main container */
        .chat-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background-color: #1e1e1e;
            border: 1px solid #444;
            border-radius: 15px;
        }


        /* Heading */
        .chat-title {
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 25px;
        }


        /* Chat box */
        #chat {
            height: 400px;
            overflow-y: auto;
            background-color: #181818;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 20px;
        }


        /* Individual messages */
        #chat div {
            padding: 10px 12px;
            margin-bottom: 8px;
            background-color: #252525;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            color: #eeeeee;
        }


        /* Input boxes */
        .form-control {
            height: 50px;
            background-color: #181818;
            color: #ffffff;
            border: 1px solid #555;
            border-radius: 8px;
        }


        /* Input placeholder */
        .form-control::placeholder {
            color: #999;
        }


        /* Input when clicked */
        .form-control:focus {
            background-color: #181818;
            color: #ffffff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.2);
        }


        /* Send button */
        .send-button {
            height: 50px;
            padding: 0 25px;
            border-radius: 8px;
        }


        /* Chat scrollbar */
        #chat::-webkit-scrollbar {
            width: 7px;
        }

        #chat::-webkit-scrollbar-track {
            background-color: #181818;
        }

        #chat::-webkit-scrollbar-thumb {
            background-color: #555;
            border-radius: 10px;
        }


        /* Mobile */
        @media (max-width: 600px) {

            .chat-container {
                margin: 20px 10px;
                padding: 20px;
            }

            .chat-title {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>

<div class="container chat-container">

    <!-- Heading -->
    <h1 class="text-center chat-title">
        Real-Time Chat Application
    </h1>


    <!-- Chat Messages -->
    <div id="chat">
    </div>


    <!-- Sender Name -->
    <div class="input-group mt-3 mb-3">

        <input id="senderInput"
               type="text"
               class="form-control"
               placeholder="Your name.....">

    </div>


    <!-- Message Input -->
    <div class="input-group">

        <input id="messageInput"
               type="text"
               class="form-control"
               placeholder="Type a message.....">

        <button id="sendMessage"
                class="btn btn-primary send-button">

            Send

        </button>

    </div>

</div>


<script>

    var stompClient = null;


    // Enable / Disable Send button
    function setConnected(connected) {

        document.getElementById('sendMessage').disabled = !connected;

    }


    // Connect to WebSocket
    function connect() {

        var socket = new SockJS('/chat');

        stompClient = Stomp.over(socket);

      stompClient.connect(
    {},
    function (frame) {

        setConnected(true);

        console.log("Connected: " + frame);

        stompClient.subscribe('/topic/message', function (message) {

            showMessage(JSON.parse(message.body));

        });

    },
    function (error) {

        console.error("WebSocket connection error:", error);

        setConnected(false);

    }
);
    }

    // Load previous messages from MySQL
function loadPreviousMessages() {

    fetch('/messages')
        .then(response => response.json())
        .then(messages => {

            messages.forEach(message => {

                showMessage(message);

            });

        })
        .catch(error => {

            console.error("Error loading messages:", error);

        });
}



    // Display message
    function showMessage(message) {

        var chat = document.getElementById('chat');

        var messageElement = document.createElement('div');

        messageElement.textContent =
            message.sender + ': ' + message.content;

        messageElement.className = "border-bottom mb-1";

        chat.appendChild(messageElement);

        // Scroll to latest message
        chat.scrollTop = chat.scrollHeight;

    }


    // Send message
    function sendMessage() {

        var sender =
            document.getElementById('senderInput').value;

        var content =
            document.getElementById('messageInput').value;


        // Don't send empty messages
        if (content.trim() === '') {
            return;
        }


        var chatMessage = {

            sender: sender,

            content: content

        };


        // Send message to Spring Boot
        stompClient.send(
            "/app/sendMessage",
            {},
            JSON.stringify(chatMessage)
        );


        // Clear message input
        document.getElementById('messageInput').value = '';

    }


    // Send button
    document.getElementById('sendMessage').onclick = sendMessage;


    // Press Enter to send
    document.getElementById('messageInput').addEventListener(
        'keydown',
        function (event) {

            if (event.key === 'Enter') {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    // Connect when page loads
    window.onload = function () {

    connect();

    loadPreviousMessages();

};

</script>

</body>

</html>
